# AI Models Configuration - API Automation Strategy
# Reference: AI_STRATEGY.md
#
# All APIs use existing licenses (included in subscriptions)
# Only DeepInfra requires pay-per-use ($5-7 target, $10 max)

# ==============================================================================
# API PROVIDERS
# ==============================================================================

providers:
  # ----------------------------------------------------------------------------
  # PRIMARY: GitHub Copilot API (90% of tasks)
  # ----------------------------------------------------------------------------
  copilot:
    name: "GitHub Copilot Pro"
    license_cost: 10  # USD/month
    api_endpoint: "https://api.githubcopilot.com/v1"  # OpenAI-compatible
    auth_method: "github_token"
    auth_env_var: "GITHUB_TOKEN"
    rate_limit: "unlimited"  # 0x pricing tier

    models:
      gpt-4o:
        model_id: "gpt-4o"
        context_window: 128000
        pricing_tier: "0x"  # FREE tier
        daily_limit: null  # UNLIMITED
        parallel_max: 12  # Can run 12 requests simultaneously
        cost_per_request: 0.0
        best_for:
          - boilerplate_code
          - crud_operations
          - schemas
          - tests
          - simple_components

      gpt-4o-mini:
        model_id: "gpt-4o-mini"
        context_window: 128000
        pricing_tier: "0x"
        daily_limit: null
        cost_per_request: 0.0
        note: "Faster than GPT-4o, use for very simple tasks"

  # ----------------------------------------------------------------------------
  # COMPLEX: Claude API (5% of tasks)
  # ----------------------------------------------------------------------------
  claude:
    name: "Claude Pro"
    license_cost: 20  # USD/month
    api_endpoint: "https://api.anthropic.com/v1/messages"
    auth_method: "api_key"
    auth_env_var: "ANTHROPIC_API_KEY"
    rate_limit: "~500/day"

    models:
      claude-sonnet-4-5:
        model_id: "claude-sonnet-4-20250514"
        context_window: 200000
        daily_limit: 500  # messages
        parallel_max: 1  # Sequential only (deep reasoning)
        cost_per_request: 0.0  # Via license
        best_for:
          - complex_business_logic
          - architecture_decisions
          - multi_file_refactoring
          - deep_reasoning

  # ----------------------------------------------------------------------------
  # VALIDATION: Google Gemini API (3% of tasks)
  # ----------------------------------------------------------------------------
  gemini:
    name: "Google AI Pro (Free Tier)"
    license_cost: 0  # FREE
    api_endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
    auth_method: "api_key"
    auth_env_var: "GOOGLE_API_KEY"
    rate_limit: "1000/day"

    models:
      gemini-2-5-pro:
        model_id: "gemini-2.5-pro"
        context_window: 1000000  # 1M tokens!
        daily_limit: 1000  # requests
        tokens_per_day: 1000000  # 1M tokens
        parallel_max: 1  # Review only
        cost_per_request: 0.0  # Free tier
        best_for:
          - full_codebase_review
          - validation
          - security_audit
          - large_context_analysis

  # ----------------------------------------------------------------------------
  # ALGORITHMS: Codex API via ChatGPT Plus (2% of tasks)
  # ----------------------------------------------------------------------------
  codex:
    name: "ChatGPT Plus"
    license_cost: 20  # USD/month
    api_endpoint: "https://api.openai.com/v1/chat/completions"
    auth_method: "api_key"
    auth_env_var: "OPENAI_API_KEY"
    rate_limit: "~80/3h"

    models:
      gpt-4-turbo:
        model_id: "gpt-4-turbo"
        context_window: 128000
        per_3_hours_limit: 80  # messages
        parallel_max: 1
        cost_per_request: 0.0  # Via ChatGPT Plus license
        best_for:
          - algorithms
          - mathematical_operations
          - edge_case_analysis
          - debugging

  # ----------------------------------------------------------------------------
  # BATCH: DeepInfra API (<1% of tasks, ONLY pay-per-use)
  # ----------------------------------------------------------------------------
  deepinfra:
    name: "DeepInfra"
    license_cost: 0  # Pay-per-use
    api_endpoint: "https://api.deepinfra.com/v1/openai"
    auth_method: "api_key"
    auth_env_var: "DEEPINFRA_API_KEY"
    rate_limit: "none"  # Budget limited only

    models:
      qwen-2-5-coder-32b:
        model_id: "Qwen/Qwen2.5-Coder-32B-Instruct"
        context_window: 32768
        cost_per_million_tokens: 0.27  # $0.27/1M tokens
        budget_max: 10.0
        budget_target: 7.0  # Aim for this
        budget_warn_at: 8.0
        parallel_max: 8  # Batch processing
        best_for:
          - batch_processing
          - i18n_conversion
          - simple_repetitive_tasks

# ==============================================================================
# TASK ASSIGNMENTS (which API for which task)
# ==============================================================================

tasks:
  # Phase 1: Backend Foundation
  # --------------------------------------------------------------------------
  db_models:
    description: "Generate 8 SQLAlchemy models"
    primary: copilot.gpt-4o
    fallback: claude.claude-sonnet-4-5
    parallel: 8  # Process all 8 simultaneously
    estimated_time: "5 min"
    estimated_cost: 0.0

  pydantic_schemas:
    description: "Generate 10 Pydantic schemas"
    primary: copilot.gpt-4o
    validator: gemini.gemini-2-5-pro  # Review after generation
    parallel: 10
    estimated_time: "6 min"
    estimated_cost: 0.0

  api_routes_simple:
    description: "Generate 12 simple CRUD routes"
    primary: copilot.gpt-4o
    parallel: 12
    estimated_time: "7 min"
    estimated_cost: 0.0

  api_routes_complex:
    description: "Generate 3 complex routes (subscriptions, stats)"
    primary: claude.claude-sonnet-4-5
    fallback: copilot.gpt-4o
    parallel: false  # Sequential (complex logic)
    estimated_time: "30 min"
    estimated_cost: 0.0

  service_layer_simple:
    description: "Generate 6 simple services"
    primary: copilot.gpt-4o
    parallel: 6
    estimated_time: "8 min"
    estimated_cost: 0.0

  service_layer_complex:
    description: "Generate 3 complex services (Subscription, Currency, Stats)"
    primary: claude.claude-sonnet-4-5
    parallel: false
    estimated_time: "45 min"
    estimated_cost: 0.0
    note: "Critical business logic - use Claude"

  payment_calculations:
    description: "Payment date calculation logic"
    primary: codex.gpt-4-turbo
    parallel: false
    estimated_time: "15 min"
    estimated_cost: 0.0
    note: "Math-heavy algorithms"

  backend_tests:
    description: "Generate 9 pytest test files"
    primary: copilot.gpt-4o
    edge_cases: codex.gpt-4-turbo  # For edge case tests
    parallel: 9
    estimated_time: "10 min"
    estimated_cost: 0.0

  # Phase 4-6: Frontend
  # --------------------------------------------------------------------------
  mui_theme:
    description: "MUI theme setup (8 colors + dark mode)"
    primary: copilot.gpt-4o
    review: claude.claude-sonnet-4-5
    parallel: false
    estimated_time: "10 min"
    estimated_cost: 0.0

  react_components_simple:
    description: "Generate 15 simple React components"
    primary: copilot.gpt-4o
    batch_alternative: deepinfra.qwen-2-5-coder-32b  # If >10 similar
    parallel: 15
    estimated_time: "12 min"
    estimated_cost: 0.0
    note: "Prefer Copilot (free) over DeepInfra (paid)"

  react_components_complex:
    description: "Generate 5 complex components (SubscriptionList, Dashboard)"
    primary: claude.claude-sonnet-4-5
    parallel: false
    estimated_time: "40 min"
    estimated_cost: 0.0

  frontend_tests:
    description: "Generate Vitest test files"
    primary: copilot.gpt-4o
    parallel: 10
    estimated_time: "12 min"
    estimated_cost: 0.0

  # Special Tasks
  # --------------------------------------------------------------------------
  i18n_conversion:
    description: "Convert 25 language files to 2 (pl, en)"
    primary: deepinfra.qwen-2-5-coder-32b
    parallel: false  # Batch processing
    estimated_time: "3 min"
    estimated_cost: 0.40
    note: "Batch makes sense here - DeepInfra is cost-effective"

  code_review_full:
    description: "Review entire codebase before final commit"
    primary: gemini.gemini-2-5-pro
    parallel: false
    estimated_time: "5 min"
    estimated_cost: 0.0
    note: "Use 1M context to analyze everything"

# ==============================================================================
# FALLBACK CHAINS
# ==============================================================================

fallback_chains:
  standard:
    description: "For simple/medium tasks"
    chain:
      - copilot.gpt-4o
      - claude.claude-sonnet-4-5
      - gemini.gemini-2-5-pro

  complex:
    description: "For complex logic tasks"
    chain:
      - claude.claude-sonnet-4-5
      - codex.gpt-4-turbo
      - gemini.gemini-2-5-pro

  validation:
    description: "For validation/review tasks"
    chain:
      - gemini.gemini-2-5-pro
      - claude.claude-sonnet-4-5

  batch:
    description: "For batch processing"
    chain:
      - copilot.gpt-4o  # Try parallel first (free)
      - deepinfra.qwen-2-5-coder-32b  # If budget available

# ==============================================================================
# USAGE LIMITS & MONITORING
# ==============================================================================

limits:
  copilot.gpt-4o:
    daily: null  # UNLIMITED
    warn_at: null
    action_on_limit: "continue"  # No limit!

  claude.claude-sonnet-4-5:
    daily: 500
    warn_at: 400
    action_on_limit: "fallback_to_codex"

  gemini.gemini-2-5-pro:
    daily_requests: 1000
    daily_tokens: 1000000
    warn_at: 800
    action_on_limit: "fallback_to_claude"

  codex.gpt-4-turbo:
    per_3_hours: 80
    warn_at: 60
    action_on_limit: "fallback_to_copilot"

  deepinfra.qwen-2-5-coder-32b:
    budget_max: 10.0
    budget_target: 7.0
    warn_at: 8.0
    track_file: ".deepinfra_budget.json"
    action_on_limit: "stop"  # Hard stop at $10

# ==============================================================================
# OPTIMIZATION RULES
# ==============================================================================

optimization:
  # Core strategy
  prefer_free_unlimited: true  # Maximize Copilot API usage
  max_deepinfra_per_task: 3.0  # Don't overspend
  batch_threshold: 10  # Use batch only if >=10 similar files
  auto_fallback: true

  # Parallel execution
  max_parallel_requests: 12  # System limit
  recommended_parallel: 8  # Sweet spot

  # Context optimization (reduce tokens = faster + cheaper)
  context_strategy:
    copilot.gpt-4o: "minimal"  # <8k tokens
    claude.claude-sonnet-4-5: "moderate"  # <50k tokens
    gemini.gemini-2-5-pro: "full"  # <500k tokens (1M available!)
    codex.gpt-4-turbo: "minimal"  # <5k tokens
    deepinfra.qwen-2-5-coder-32b: "minimal"  # <3k tokens

  # Cost tracking
  cost_tracking:
    enabled: true
    budget_file: ".deepinfra_budget.json"
    alert_on_overspend: true
    log_all_requests: true
    log_file: ".ai_requests.log"

  # Retry logic
  retry:
    max_attempts: 3
    backoff: "exponential"  # 1s, 2s, 4s
    retry_on:
      - "rate_limit_exceeded"
      - "server_error"
      - "timeout"

# ==============================================================================
# QUICK REFERENCE
# ==============================================================================

quick_reference:
  simple_task: "copilot.gpt-4o (unlimited, parallel)"
  complex_logic: "claude.claude-sonnet-4-5 (sequential)"
  validation: "gemini.gemini-2-5-pro (1M context)"
  algorithms: "codex.gpt-4-turbo (math expert)"
  batch_10plus: "deepinfra.qwen-2-5-coder-32b (if ROI positive)"

  scripts:
    orchestrator: "python scripts/automation/orchestrator.py"
    test_apis: "python scripts/automation/test_apis.py"
    budget_check: "python scripts/automation/deepinfra_batch.py --task=budget"
    validator: "python scripts/automation/context_validator.py"

  estimated_total_time:
    phase_1_backend: "~2 hours (vs 12.8h manual)"
    phase_4_frontend: "~3 hours (vs 10h manual)"
    total_project: "~15 hours (vs 50h manual)"
    automation_savings: "70%"

  estimated_total_cost:
    copilot_api: "$0 (via license)"
    claude_api: "$0 (via license)"
    gemini_api: "$0 (free tier)"
    codex_api: "$0 (via license)"
    deepinfra_api: "$5-7 (pay-per-use)"
    total: "$5-7"
